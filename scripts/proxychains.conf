# Proxychains config for Cline header sniffing (v2 — dynamic chain, no DNS proxy)
# Usage: proxychains4 -f scripts/proxychains.conf cline

# Use dynamic_chain so if the proxy is down it doesn't hard-hang
dynamic_chain

# Disable DNS proxying — let the OS resolve, then proxy the TCP connection.
# proxy_dns often hangs with Bun/io_uring.
# proxy_dns

remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000
localnet 127.0.0.0/255.0.0.0
quiet_mode

[ProxyList]
http 127.0.0.1 8083
